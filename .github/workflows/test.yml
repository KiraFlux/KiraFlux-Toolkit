name: Unit Tests

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  gather-test-suites:
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.find.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
      - name: Find test suites
        id: find
        run: chmod +x ./find-test-suites.sh && echo "suites=$(bash find-test-suites.sh)" >> "$GITHUB_OUTPUT"

  test:
    needs: gather-test-suites
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.gather-test-suites.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache PlatformIO and pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
          key: ${{ runner.os }}-pio-test-${{ hashFiles('**/platformio.ini', 'library.json') }}
          restore-keys: |
            ${{ runner.os }}-pio-test-
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - name: Run test suite ${{ matrix.suite }}
        run: pio test -e native --filter "${{ matrix.suite }}"
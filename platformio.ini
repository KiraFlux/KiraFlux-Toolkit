[platformio]
lib_dir = .
src_dir = src

[env:native]
platform = native
test_framework = unity
build_flags = 
    -Isrc
    -Itest
    -std=c++17
lib_deps = throwtheswitch/Unity
lib_ignore = Unity/examples/example_1

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
test_framework = unity
build_flags = 
    -Isrc
    -Itest
    -std=c++17
lib_deps = throwtheswitch/Unity
lib_ignore = Unity/examples/example_1
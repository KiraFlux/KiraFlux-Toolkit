[platformio]
; lib root dir
lib_dir = .
; src root dir
src_dir = src

[env:native]
platform = native
test_framework = unity
build_flags = 
    -Isrc               ; for #include <kf/...>
    -std=c++17
lib_deps = 
    throwtheswitch/Unity

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
test_framework = unity
build_flags = 
    -Isrc
    -std=c++17
lib_deps = 
    throwtheswitch/Unity